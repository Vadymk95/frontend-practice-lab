name: Deploy

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            HUSKY: '0'

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The same gate chain as CI and the pre-push hook; the build is the deploy's own step.
            - name: Verify (gate chain)
              run: npm run verify:ci

            - name: Build
              run: npm run build

            - name: Deploy to Firebase Hosting
              run: npx firebase-tools deploy --only hosting --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
